# Replaces the Chainguard image's /etc/nginx/conf.d/nginx.default.conf (this file is included in the
# `http` block). The image runs nginx as non-root (uid 65532), so it listens on 8080; TLS is terminated in
# front of it (edge traefik -> cluster ingress).
#
# The browser never sees the Amber API key: /api/prices and /api/usage are proxied to Amber here, and
# the key + site id come from /etc/nginx/amber/amber.conf, mounted from a Kubernetes Secret (see README).

# Re-resolve api.amber.com.au while running: it's behind CloudFront, whose IPs change.
include /etc/nginx/conf.d/resolver.inc;

upstream amber_api {
    zone amber_api 64k;
    server api.amber.com.au:443 resolve;
    keepalive 4;
}

# Every tablet asks for the same prices once a minute; serve them from a short cache so the Amber key
# makes at most ~1 upstream call a minute however many screens (or strangers) hit the page.
proxy_cache_path /var/lib/nginx/tmp/amber-cache levels=1 keys_zone=amber_cache:1m max_size=20m inactive=15m
                 use_temp_path=off;

# Behind the ingress every request arrives from a traefik pod, so this is effectively a global limit:
# a backstop that keeps a flood of cache-busting requests from burning through Amber's rate limit.
limit_req_zone $server_name zone=amber_api_limit:1m rate=20r/m;

server {
    listen 8080;
    server_name amber-dashboard;
    root /usr/share/nginx/dashboard;
    index index.html;

    server_tokens off;
    # Behind a TLS-terminating proxy, so never build redirects with this server's http scheme/port
    absolute_redirect off;
    client_max_body_size 1k;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Page, app code, manifest and service worker: always revalidate, so a redeploy shows up on the next load
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # Library files have the version in their name, so they can be cached forever
    location ~ "^/[a-z]+-[0-9]+\.[0-9]+\.[0-9]+\.min\.js$" {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Today's/tomorrow's prices for the one configured site. Together with /api/usage below, the only
    # routes to Amber: nothing else the key can read (older usage, site/NMI details) is reachable.
    location = /api/prices {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Cache-Status $upstream_cache_status always;
        default_type application/json;
        # Not limit_except: its 403 would be relabelled by the error_page 403 below
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"error":"method-not-allowed"}';
        }

        set $amber_site_id "";
        set $amber_authorization "";
        include /etc/nginx/amber/*.conf;   # sets both of the above; absent until the Secret exists
        if ($amber_authorization = "") {
            return 503 '{"error":"not-configured"}';
        }
        if ($arg_startDate !~ "^[0-9]{4}-[0-9]{2}-[0-9]{2}$") {
            return 400 '{"error":"bad-request"}';
        }
        if ($arg_endDate !~ "^[0-9]{4}-[0-9]{2}-[0-9]{2}$") {
            return 400 '{"error":"bad-request"}';
        }

        limit_req zone=amber_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_cache amber_cache;
        proxy_cache_key "$amber_site_id|$arg_startDate|$arg_endDate";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;   # never on error: stale prices must show up as stale
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        proxy_pass https://amber_api/v1/sites/$amber_site_id/prices?startDate=$arg_startDate&endDate=$arg_endDate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.amber.com.au;
        proxy_set_header Authorization $amber_authorization;
        proxy_set_header Accept "application/json";
        # Send nothing from the browser upstream beyond the query above
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header User-Agent "amber-dashboard";
        proxy_pass_request_body off;
        proxy_ssl_server_name on;
        proxy_ssl_name api.amber.com.au;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header Set-Cookie;

        # Don't relay Amber's error bodies; just say what kind of failure it was
        proxy_intercept_errors on;
        error_page 401 403 = @amber_rejected_key;
        error_page 429 = @amber_rate_limited;
        error_page 500 502 504 = @amber_unavailable;
    }

    # Metered usage and cost for one calendar month (start on the 1st, end in the same month), for the
    # month-to-date cost. Meter data only arrives about a day late, so it is cached far longer than prices.
    location = /api/usage {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Cache-Status $upstream_cache_status always;
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"error":"method-not-allowed"}';
        }

        set $amber_site_id "";
        set $amber_authorization "";
        include /etc/nginx/amber/*.conf;
        if ($amber_authorization = "") {
            return 503 '{"error":"not-configured"}';
        }
        set $usage_range "$arg_startDate|$arg_endDate";
        if ($usage_range !~ "^([0-9]{4}-[0-9]{2})-01\|\1-[0-9]{2}$") {
            return 400 '{"error":"bad-request"}';
        }

        limit_req zone=amber_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_cache amber_cache;
        proxy_cache_key "usage|$amber_site_id|$arg_startDate|$arg_endDate";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        proxy_pass https://amber_api/v1/sites/$amber_site_id/usage?startDate=$arg_startDate&endDate=$arg_endDate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.amber.com.au;
        proxy_set_header Authorization $amber_authorization;
        proxy_set_header Accept "application/json";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header User-Agent "amber-dashboard";
        proxy_pass_request_body off;
        proxy_ssl_server_name on;
        proxy_ssl_name api.amber.com.au;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Set-Cookie;

        proxy_intercept_errors on;
        error_page 401 403 = @amber_rejected_key;
        error_page 429 = @amber_rate_limited;
        error_page 500 502 504 = @amber_unavailable;
    }

    location @amber_rejected_key {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 502 '{"error":"amber-rejected-key"}';
    }

    location @amber_rate_limited {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 429 '{"error":"rate-limited"}';
    }

    location @amber_unavailable {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 502 '{"error":"amber-unavailable"}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
